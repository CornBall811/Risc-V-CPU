name: GDSII Flow
on: [push]

jobs:
  openlane_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Run OpenLane (Hardening)
        # We run the docker command directly as a script step
        run: |
          docker run --rm \
            -v $(pwd):/openlane_design \
            -w /openlane_design \
            efabless/openlane:v0.48 \
            bash -c "./flow.tcl -design ./openlane -overwrite"

      - name: Upload GDSII
        uses: actions/upload-artifact@v4
        with:
          name: RV32I_GDSII
          path: openlane/runs/*/results/final/gds/*.gds
