name: GDSII Flow
on: [push]

jobs:
  openlane_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4.2.2  # Updated for Node 24 support

      - name: Run OpenLane
        uses: efabless/openlane-main-action@v2
        with:
          # In this action, these are the correct input names:
          install_pdk: true
          pdk: sky130A
          design_dir: ./openlane
          
      - name: Upload GDSII
        uses: actions/upload-artifact@v4.6.0 # Updated for Node 24 support
        with:
          name: RV32I_GDSII
          # Artifact path for the efabless action
          path: openlane/runs/*/results/final/gds/*.gds
