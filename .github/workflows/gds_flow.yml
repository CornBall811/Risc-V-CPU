name: GDSII Flow
on: [push]

jobs:
  openlane_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6 # Updated for Node 24 support

      - name: Run OpenLane (Hardening)
        run: |
          docker run --rm \
            -v $(pwd):/openlane_design \
            -w /openlane_design \
            ghcr.io/the-openroad-project/openlane:latest \
            bash -c "./flow.tcl -design ./openlane -overwrite"

      - name: Upload GDSII
        uses: actions/upload-artifact@v5 # Updated for Node 24 support
        with:
          name: RV32I_GDSII
          path: openlane/runs/*/results/final/gds/*.gds
