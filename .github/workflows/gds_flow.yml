name: GDSII Flow
on: [push]

jobs:
  openlane_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Openlane CLI
        uses: theopenlane/setup-openlane@v0.0.1
        with:
          version: 'v0.45.10' # The stable 2026 CLI version

      - name: Verify Environment
        run: |
          openlane --version
          volare --version

      - name: Run Hardening
        run: |
          # This command triggers the OpenLane 2 flow using your config
          openlane --config ./openlane/config.json --pdk sky130A
          
      - name: Upload GDSII
        uses: actions/upload-artifact@v4
        with:
          name: RV32I_GDSII
          # Path for OpenLane 2 output
          path: runs/*/final/gds/*.gds
